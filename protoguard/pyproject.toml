[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "protoguard"
version = "0.1.0"
description = "Anomaly detection for Modbus/TCP and MQTT traffic: pure-Python parsers, windowed features and calibrated detectors."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "1amTejas" }]
keywords = ["ics", "iiot", "iot", "modbus", "mqtt", "anomaly-detection", "network-security"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
]
dependencies = []  # the core has no third-party dependencies

[project.optional-dependencies]
ml = ["scikit-learn>=1.3"]
dev = ["pytest>=8", "ruff>=0.4", "scikit-learn>=1.3"]

[project.scripts]
protoguard = "protoguard.cli:main"

[tool.setuptools.packages.find]
include = ["protoguard*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py39"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
